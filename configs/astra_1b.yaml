model:
  name: "astra-1b"
  vocab_size: 65536
  hidden_size: 2048
  intermediate_size: 3456
  num_layers: 24
  layer_pattern:
    - "gdn"
    - "gdn"
    - "gdn"
    - "attention"
  norm_eps: 1.0e-6
  tie_word_embeddings: true
  max_position_embeddings: 4096

gdn:
  num_heads: 16
  head_dim: 96
  conv_kernel: 4
  key_norm_eps: 1.0e-6
  retention_bias_init: 3.0
  update_bias_init: -0.5
  output_bias_init: 2.0
  gated: true

attention:
  num_q_heads: 16
  num_kv_heads: 4
  head_dim: 128
  rope_theta: 1000000.0
  gated: true
  gate_bias_init: 2.0

mtp:
  enabled: true
  horizon: 2
  loss_weight: 0.2

training:
  dtype: "bfloat16"
  peak_lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_ratio: 0.02
  weight_decay: 0.1
  max_grad_norm: 1.0
  context_stages:
    - 4096
    - 8192
    - 16384
    - 32768
