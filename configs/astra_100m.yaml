model:
  name: "astra-100m"
  vocab_size: 32768
  hidden_size: 768
  intermediate_size: 1536
  num_layers: 12
  layer_pattern:
    - "gdn"
    - "gdn"
    - "gdn"
    - "attention"
  norm_eps: 1.0e-6
  tie_word_embeddings: true
  max_position_embeddings: 2048

gdn:
  num_heads: 8
  head_dim: 64
  conv_kernel: 4
  key_norm_eps: 1.0e-6
  retention_bias_init: 3.0
  update_bias_init: -0.5
  output_bias_init: 2.0
  gated: true

attention:
  num_q_heads: 8
  num_kv_heads: 2
  head_dim: 64
  rope_theta: 1000000.0
  gated: true
  gate_bias_init: 2.0

mtp:
  enabled: true
  horizon: 2
  loss_weight: 0.2

training:
  dtype: "bfloat16"
  peak_lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_ratio: 0.02
  weight_decay: 0.1
  max_grad_norm: 1.0
  context_stages:
    - 2048
